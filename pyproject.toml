[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "csbox"
version = "0.1.0"
description = "计算机实验与项目交付工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10,<13",
  "pydantic>=2.7,<3",
  "pyte>=0.8,<1",
  "rich>=13.7,<15",
  "textual>=0.58,<1",
  "typer>=0.12,<1",
  "wcwidth>=0.2.13,<1",
  "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.scripts]
csbox = "csbox.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/csbox"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
