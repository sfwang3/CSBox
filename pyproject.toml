[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "csbox"
version = "0.3.0"
description = "计算机实验与项目交付工具"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10,<13",
  "pydantic>=2.7,<3",
  "pyte>=0.8,<1",
  "rich>=13.7,<15",
  "textual>=0.58,<1",
  "typer>=0.12,<1",
  "wcwidth>=0.2.13,<1",
  "pywinpty>=3.0,<4; sys_platform == 'win32'",
  "httpx>=0.27,<1",
  "jsonpath-ng>=1.7,<2",
  "pyyaml>=6,<7",
]

[project.scripts]
csbox = "csbox.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/csbox"]

[tool.hatch.build.targets.sdist]
include = [
  "CHANGELOG.md",
  "LICENSE",
  "README.md",
  "docs/API_EVIDENCE.md",
  "docs/ARCHITECTURE.md",
  "docs/SECURITY.md",
  "docs/SESSION_FORMAT.md",
  "docs/TERMINAL_BACKENDS.md",
  "docs/TUI_DESIGN.md",
  "pyproject.toml",
  "src/csbox/**",
  "uv.lock",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "pty: real pseudoterminal integration tests",
  "windows: Windows-specific integration tests",
  "integration: tests that exercise real platform processes or terminal resources",
  "stress: bounded long-running session reliability tests",
]
