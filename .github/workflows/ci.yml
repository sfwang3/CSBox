name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Windows PowerShell 5.1 ConPTY smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: uv run pytest -m "windows and integration" --shell-kind powershell

      - name: PowerShell 7 ConPTY smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: uv run pytest -m "windows and integration" --shell-kind pwsh
