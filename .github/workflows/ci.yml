name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    # Node 24 actions require GitHub Actions runner v2.327.1 or newer.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Windows PowerShell 5.1 ConPTY smoke
        if: runner.os == 'Windows'
        shell: powershell
        env:
          CSBOX_REQUIRE_NATIVE_SHELL: "1"
        run: uv run pytest -m "windows and integration" --shell-kind powershell

      - name: PowerShell 7 ConPTY smoke
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CSBOX_REQUIRE_NATIVE_SHELL: "1"
        run: uv run pytest -m "windows and integration" --shell-kind pwsh
