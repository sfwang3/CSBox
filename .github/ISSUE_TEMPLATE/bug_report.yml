name: Bug report
description: Help us reproduce a CSBox problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        Do not paste passwords, API tokens, private keys, cookies, or other credentials. Remove secrets and private project data from logs before posting.
  - type: input
    id: csbox_version
    attributes:
      label: CSBox version
      description: Run `csbox --version` and paste the result.
      placeholder: 0.7.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: terminal_shell
    attributes:
      label: Terminal and shell
      description: Required when the problem involves the terminal, TUI, or a shell.
      placeholder: Windows Terminal + PowerShell 7 / Bash / other
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: 3.11.15
  - type: textarea
    id: workflow
    attributes:
      label: Command or workflow
      description: What command or TUI path were you using?
      placeholder: "csbox ... or Home → ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste sanitized output only. Remove passwords, API tokens, private keys, cookies, and other credentials.
